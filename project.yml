name: runwai

options:
  bundleIdPrefix: app.runwai
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.2.0
    GENERATE_INFOPLIST_FILE: YES
  configs:
    Debug:
      CODE_SIGNING_ALLOWED: NO
    Release:
      CODE_SIGN_STYLE: Automatic

targets:
  Runwai:
    type: application
    platform: macOS
    sources:
      - path: Runwai
    postBuildScripts:
      - name: Embed pinned Lowdown helper
        script: bash "$SRCROOT/scripts/embed_lowdown.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.runwai
        PRODUCT_NAME: runwai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: runwai
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - RunwaiTests

  RunwaiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RunwaiTests
    dependencies:
      - target: Runwai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.runwai.tests
        PRODUCT_NAME: RunwaiTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/runwai.app/Contents/MacOS/runwai"
